services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_JWT_PUBLIC_KEY: ${BACKEND_JWT_PUBLIC_KEY:-}
      BACKEND_JWT_ISSUER: ${BACKEND_JWT_ISSUER:-repif-frontend}
      BACKEND_JWT_AUDIENCE: ${BACKEND_JWT_AUDIENCE:-repif-backend}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
      MODEL_APARTMENT: ${MODEL_APARTMENT:-apartment_dev_20260621_220900.joblib}
      MODEL_HOUSE: ${MODEL_HOUSE:-house_dev_20260621_220900.joblib}
      MODEL_METRICS: ${MODEL_METRICS:-metrics_dev.json}
      RATE_LIMIT_PREDICT: ${RATE_LIMIT_PREDICT:-10/minute}
      RATE_LIMIT_PREDICTIONS: ${RATE_LIMIT_PREDICTIONS:-60/minute}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models_back:/backend/models_back
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_JWT_PRIVATE_KEY: ${BACKEND_JWT_PRIVATE_KEY:-}
      BACKEND_JWT_ISSUER: ${BACKEND_JWT_ISSUER:-repif-frontend}
      BACKEND_JWT_AUDIENCE: ${BACKEND_JWT_AUDIENCE:-repif-backend}
      BACKEND_JWT_TTL_SECONDS: ${BACKEND_JWT_TTL_SECONDS:-300}
      RATE_LIMIT_PREDICT_PER_MIN: ${RATE_LIMIT_PREDICT_PER_MIN:-10}
      RATE_LIMIT_PREDICTIONS_PER_MIN: ${RATE_LIMIT_PREDICTIONS_PER_MIN:-60}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
